name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
      - run: nextflow run . -profile test -stub --outdir results
  integration:
    runs-on: ubuntu-latest
    needs: stub
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          conda-remove-defaults: true
          auto-activate-base: true
      - run: nextflow run . -profile test,conda --outdir results
      - run: |
          find results -maxdepth 4 -type f -print
          test -s results/merge_counts/count_matrix.tsv
          test -s results/deseq2/DEGs.tsv
          test -s results/edger/DEGs.tsv
          test -s results/multiqc/multiqc_report.html
          test -s results/pipeline_info/report.html
